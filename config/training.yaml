# VoiceShield IndicTTS Training & Augmentation Configuration
dataset:
  name: "SherryT997/IndicTTS-Deepfake-Challenge-Data"
  data_dir: "dataindictts/data"
  splits_dir: "data/splits"
  sample_rate: 16000
  target_languages:
    - "Assamese"
    - "Bengali"
    - "Bodo"
    - "Dogri"
    - "English"
    - "Gujarati"
    - "Hindi"
    - "Kannada"
    - "Malayalam"
    - "Manipuri"
    - "Marathi"
    - "Nepali"
    - "Odia"
    - "Sanskrit"
    - "Tamil"
    - "Telugu"

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  disjoint_speaker_splitting: true

model:
  name: "VoiceShieldNet-IndicTTS"
  architecture: "Spectro-Temporal Residual CNN with Delta Features"
  in_channels: 3
  n_mels: 64
  n_fft: 1024
  hop_length: 512
  chunk_duration_sec: 1.5

training:
  epochs: 10
  batch_size: 16
  learning_rate: 0.0005
  weight_decay: 0.0001
  early_stopping_patience: 4
  checkpoint_dir: "models"
  output_model: "models/voiceshield_indictts_best.pt"
  config_file: "models/training_config.json"

augmentation:
  enabled: true
  background_noise:
    enabled: true
    noise_level: 0.005
  spec_augment:
    enabled: true
    freq_mask_param: 8
    time_mask_param: 6
  channel_distortion:
    enabled: true
    telephony_simulation: true
